[project]
name = "slotfill"
version = "0.1.0"
description = "Can a small LoRA-tuned model extract invoice fields into a strict JSON schema at a fraction of a frontier model's cost?"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.21",
    "pillow>=10.0",
    "anthropic>=1.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

# Training (train/train_vlm.py) needs unsloth + a CUDA torch and runs on Colab/Kaggle, never
# locally; it is deliberately not an optional-dependency group here because unsloth's install
# is GPU-image specific. `train/colab_train.ipynb` has the install cell. The rest of `train/`
# (targets, export, smoke) runs on the base dependencies and is tested locally.

[tool.setuptools]
packages = ["schema", "data", "eval", "train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# Colab cells are mostly shell magics; not Python to lint.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
